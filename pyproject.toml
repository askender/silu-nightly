[build-system]
requires = ["setuptools>=45", "wheel"]
[project]
name = "pysilu"
version = "1.19.0"
description = "A self-hosted compiled language with Python syntax"
readme = "README.md"
authors = [{ name = "askender", email = "askender43@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "llvmlite>=0.36.0",
 "pycparser>=2.21",
 "z3-solver>=4.12.0",
 "loguru>=0.7.2",
]

[project.urls]
Homepage = "https://silu.askender.xyz/"
Documentation = "https://silu.askender.xyz/language.html"
Repository = "https://github.com/askender/silu-lang"

[project.scripts]
silu = "silu.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["silu*", "tools*", "selfhost*"]

[tool.setuptools.package-data]
tools = ["*.si", "*.c"]
selfhost = ["*.si"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Keep the lint contract explicit: an unconstrained new Ruff release
# must not silently turn a working development tree into a red CI gate.
select = ["E4", "E7", "E9", "F"]
# F403/F405: star imports are the dual-valid single-source pattern
# (typed_helpers.__all__ feeds the converter family; flatten inlines it)
ignore = ["F403", "F405"]

[tool.coverage.run]
# subprocess coverage: pytest-cov sets COVERAGE_PROCESS_START, the
# repo-root sitecustomize.py calls coverage.process_startup() in every
# child `python -m silu` process, children write .coverage.* shards
source = ["silu"]
parallel = true
sigterm = true

[dependency-groups]
dev = ["pytest>=7.0.1", "pytest-cov>=4.0.0", "ruff==0.11.12"]
