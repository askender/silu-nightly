name: release

on:
  push:
    tags: ["v*"]

jobs:
  binaries:
    # Each archive carries the driver and its adjacent compiler. Python
    # is needed only for the build; end users need a C toolchain (clang).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: macos-13
            platform: macos-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: ubuntu-latest
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -e . build
      - name: Bootstrap the toolchain
        run: python -c 'from tools.selfhost_build import ensure_siluc; ensure_siluc()'
      - name: Smoke (compile + run fib)
        run: |
          ./siluc benchmarks/fib.si -o /tmp/fib && /tmp/fib
      - name: Verify wheel bootstrap in a clean environment
        run: |
          python -m build --wheel
          python -m venv /tmp/silu-wheel-venv
          /tmp/silu-wheel-venv/bin/pip install dist/pysilu-*-py3-none-any.whl
          chmod -R a-w /tmp/silu-wheel-venv/lib
          cd /tmp
          HOME=/tmp/silu-wheel-home XDG_CACHE_HOME=/tmp/silu-wheel-cache \
            /tmp/silu-wheel-venv/bin/silu bootstrap
          toolchain=$(find /tmp/silu-wheel-cache -name siluc -type f -print -quit)
          "$toolchain" "$GITHUB_WORKSPACE/examples/hello.si" -o /tmp/silu-wheel-hello
          /tmp/silu-wheel-hello | grep -qx 'Hello, Silu!'
      - name: Stage versioned archive
        env:
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          pkg="siluc-${TAG#v}-${PLATFORM}"
          mkdir -p "dist/$pkg"
          cp siluc siluc1 "dist/$pkg/"
          cp benchmarks/fib.si "dist/$pkg/fib.si"
          cp examples/hello.si "dist/$pkg/hello.si"
          cp tools/release_README.md "dist/$pkg/README.md"
          cd dist
          tar -czf "$pkg.tar.gz" "$pkg"
          shasum -a 256 "$pkg.tar.gz" > "$pkg.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: siluc-${{ matrix.platform }}
          path: dist/*.tar.gz*
      # Release artifacts are promoted to the public showcase with
      # tools/promote_release.sh after the private CI gate is green.
      # No cross-repository write token is needed in this workflow.
