name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      gates:
        description: Run only the self-hosting gates (skip the fast suite)
        required: false
        type: boolean
        default: true
  schedule:
    # the self-hosting gates weekly (Mondays 03:00 UTC)
    - cron: "0 3 * * 1"

jobs:
  fast:
    if: github.event_name != 'workflow_dispatch' || inputs.gates != true
    # The fast layer: lint + the full test suite minus the self-hosting
    # gates (fixed points, native parity, frontend corpus, the siluc
    # driver) - those compile the toolchain natively several times over
    # and belong to the slow layer, run locally before tagging or via
    # workflow_dispatch below.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff==0.11.12
      - name: Lint (ruff, F403/F405 exempted in pyproject)
        run: ruff check silu/ tools/
      - name: Fast tests
        run: >
          pytest tests/ -q -x
          --ignore=tests/test_selfhost_fixed_point.py
          --ignore=tests/test_pipeline_fixed_point.py
          --ignore=tests/test_si_converter_native_parity.py
          --ignore=tests/test_frontend_parity_corpus.py
          --ignore=tests/test_siluc_driver.py
          --ignore=tests/test_selfhost_m1.py
          --ignore=tests/test_selfhost_m2.py
          --ignore=tests/test_selfhost_m3.py
          --ignore=tests/test_selfhost_m4.py
          --ignore=tests/test_asan_compiler.py

  gates:
    # The slow layer: the byte-identity self-hosting gates. Requires
    # clang (preinstalled on ubuntu runners). Runs on demand only -
    # `gh workflow run ci.yml -f gates=true` or via the Actions UI.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.gates)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov
      - name: Self-hosting gates (fixed points + parity, subprocess coverage)
        run: >
          pytest tests/test_selfhost_fixed_point.py
          tests/test_pipeline_fixed_point.py
          tests/test_si_converter_native_parity.py
          tests/test_frontend_parity_corpus.py
          tests/test_siluc_driver.py
          tests/test_selfhost_m1.py
          tests/test_selfhost_m2.py
          tests/test_selfhost_m3.py
          tests/test_selfhost_m4.py
          tests/test_asan_compiler.py -q --cov=silu --cov-report=term

  wasm:
    # The WASM layer: shim + run + backend + corpus + wat2wasm gates.
    # Heavy prereqs (wasi-sdk, wabt, native toolchain builds) - on
    # demand, weekly, and at tag pushes (the release wasm verification).
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.gates)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Install wasi-sdk 34.0 (wasm64 needs LLVM 19+; pinned to the dev version)
        run: |
          wget -q https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          mkdir -p "$HOME/wasi-sdk"
          tar xzf wasi-sdk-34.0-x86_64-linux.tar.gz -C "$HOME/wasi-sdk" --strip-components=1
      - name: Install wabt 1.0.42 (the wat2wasm differential oracle)
        run: |
          wget -q https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42-linux-x64.tar.gz
          tar xzf wabt-1.0.42-linux-x64.tar.gz
          echo "$PWD/wabt-1.0.42/bin" >> "$GITHUB_PATH"
      - name: Build the native helper chain (fe + siluc1 + backend)
        run: |
          python3 -c "import sys; sys.path.insert(0, '.'); from tools.selfhost_build import ensure_frontend, ensure_siluc; ensure_frontend(); ensure_siluc()"
          python3 -m silu build selfhost/wasm_backend.si -o /tmp/wasm_backend_native
      - name: Build the wasm64 artifacts
        run: python3 wasm/build.py web
      - name: Shim gate (252 vectors vs the C library)
        run: node wasm/test_shim.mjs
      - name: Run gate (three-way wasm/native/CPython + loud bails)
        run: node wasm/test_run.mjs
      - name: Backend gate (L2 vs CPython)
        run: node wasm/test_backend.mjs
      - name: Corpus gate (15/15 byte-identical)
        run: node wasm/test_corpus.mjs
      - name: wat2wasm gate (33/33 byte-identical vs wabt)
        run: node wasm/test_wat2wasm.mjs
      - name: Compile gate (wasm siluc1 vs native siluc1)
        run: node wasm/test_compile.mjs
