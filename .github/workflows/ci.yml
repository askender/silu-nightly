name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    # The fast layer: lint + the full test suite minus the self-hosting
    # gates (fixed points, native parity, frontend corpus, the siluc
    # driver) - those compile the toolchain natively several times over
    # and belong to the slow layer, run locally before tagging or via
    # workflow_dispatch below.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install llvmlite pycparser z3-solver loguru pytest ruff
      - name: Lint (ruff, F403/F405 exempted in pyproject)
        run: ruff check silu/ tools/
      - name: Fast tests
        run: >
          pytest tests/ -q -x
          --ignore=tests/test_selfhost_fixed_point.py
          --ignore=tests/test_pipeline_fixed_point.py
          --ignore=tests/test_si_converter_native_parity.py
          --ignore=tests/test_frontend_parity_corpus.py
          --ignore=tests/test_siluc_driver.py
          --ignore=tests/test_selfhost_m1.py
          --ignore=tests/test_selfhost_m2.py
          --ignore=tests/test_selfhost_m3.py
          --ignore=tests/test_selfhost_m4.py

  gates:
    # The slow layer: the byte-identity self-hosting gates. Requires
    # clang (preinstalled on ubuntu runners). Runs on demand only -
    # `gh workflow run ci.yml -f gates=true` or via the Actions UI.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install llvmlite pycparser z3-solver loguru pytest
      - name: Self-hosting gates (fixed points + parity)
        run: >
          pytest tests/test_selfhost_fixed_point.py
          tests/test_pipeline_fixed_point.py
          tests/test_si_converter_native_parity.py
          tests/test_frontend_parity_corpus.py
          tests/test_siluc_driver.py
          tests/test_selfhost_m1.py
          tests/test_selfhost_m2.py
          tests/test_selfhost_m3.py
          tests/test_selfhost_m4.py -q
